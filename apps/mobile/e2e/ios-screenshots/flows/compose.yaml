appId: tech.corvo.bots.mobile
name: Compose
---
- runFlow:
    file: ../subflows/sign-in.yaml
    env:
      CORVO_ACTIVE_EMAIL: ${CORVO_SCREENSHOT_EMAIL}
- openLink: "corvo:///new-space"
- extendedWaitUntil:
    visible: "Customer support|Create space"
    timeout: 15000
- takeScreenshot: 02-new-space
- tapOn: "Cancel"
- openLink: "corvo:///new-group"
- extendedWaitUntil:
    visible: "Search bots"
    timeout: 15000
- tapOn: "Researcher"
- tapOn: "Writer"
- takeScreenshot: 03-new-group
- tapOn: "Next"
- assertVisible: "Skip"
- takeScreenshot: 04-new-group-name
- openLink: "corvo:///"
