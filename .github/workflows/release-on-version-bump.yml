name: release-on-version-bump

# When a change that bumps the desktop app's version lands on main and its checks pass, tag it and
# start the release build, so a release needs nothing but the version bump. A tag created with the
# workflow token does not start other workflows by itself, so the build is started explicitly on the
# tag. A version whose tag already exists is left alone, which also covers a tag pushed by hand.
on:
  workflow_run:
    workflows: [checks]
    types: [completed]
    branches: [main]

permissions: {}

concurrency:
  group: release-on-version-bump
  cancel-in-progress: false

jobs:
  tag:
    name: Tag a new version
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Tag and build when the version changed
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          file=apps/desktop/package.json
          now="$(node -p "require('./$file').version")"
          before="$(git show "$SHA~1:$file" | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).version")"
          if [ "$now" = "$before" ]; then
            echo "The desktop version is still $now: nothing to release."
            exit 0
          fi
          if ! printf '%s' "$now" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Version $now is not MAJOR.MINOR.PATCH: not releasing it."
            exit 0
          fi
          tag="v$now"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" >/dev/null 2>&1; then
            echo "$tag already exists: nothing to do."
            exit 0
          fi
          gh api "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/$tag" -f "sha=$SHA" >/dev/null
          echo "Tagged $SHA as $tag."
          gh workflow run desktop-apps.yml --repo "$GITHUB_REPOSITORY" --ref "$tag"
          echo "Started the desktop-apps build for $tag."
