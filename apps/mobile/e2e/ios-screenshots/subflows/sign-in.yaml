appId: tech.corvo.bots.mobile
---
- runFlow: launch-app.yaml
- runFlow:
    when:
      visible: "Sign up for Rook"
    commands:
      - tapOn: "Sign in"
- extendedWaitUntil:
    visible: "Sign in to Rook"
    timeout: 15000
- tapOn: "Email"
- inputText: ${CORVO_ACTIVE_EMAIL}
- tapOn: "Password"
- inputText: ${CORVO_SCREENSHOT_PASSWORD}
- hideKeyboard
- tapOn: "Sign in"
- tapOn:
    text: "Not Now"
    optional: true
- tapOn:
    text: "Don’t allow"
    optional: true
- tapOn:
    text: "Don't allow"
    optional: true
- extendedWaitUntil:
    visible: "Account"
    timeout: 40000
