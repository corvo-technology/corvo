name: pr-title

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions: {}

jobs:
  conventional:
    name: Conventional title
    runs-on: ubuntu-24.04
    steps:
      - name: Check the title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9._/-]+\))?!?: [^A-Z.].*[^.]$'
          if ! printf '%s' "$TITLE" | grep -Eq "$pattern"; then
            echo "The pull request title must follow Conventional Commits: type(scope): summary"
            echo "Types: feat, fix, docs, style, refactor, perf, test, build, ci, chore, revert."
            echo "The summary starts in lowercase, is imperative and has no trailing period."
            exit 1
          fi
