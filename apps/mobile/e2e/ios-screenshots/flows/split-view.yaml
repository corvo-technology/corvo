appId: tech.corvo.bots.mobile
name: Split view
---
# On a phone this is a single column; on an unfolded iPhone Duo the chat list sits beside it.
- runFlow:
    file: ../subflows/sign-in.yaml
    env:
      CORVO_ACTIVE_EMAIL: ${CORVO_SCREENSHOT_EMAIL}
- openLink: "corvo:///thread?botId=${CORVO_SCREENSHOT_BOT_ID}&name=Researcher"
- extendedWaitUntil:
    visible: ".*The fixture workspace is ready.*"
    timeout: 20000
- takeScreenshot: 01-chat-beside-list
- runFlow:
    when:
      visible: "Hide chats"
    commands:
      - tapOn: "Hide chats"
      - extendedWaitUntil:
          visible: "Show chats"
          timeout: 5000
      - takeScreenshot: 02-chats-hidden
      - tapOn: "Show chats"
